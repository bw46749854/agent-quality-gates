# 台帳の設定。プロジェクトの配置に合わせて書き換える。
# パスはすべてリポジトリのルートからの相対パス。glob は `*`（1階層）と `**`（複数階層）が使える。

# 本番コードを置く場所。この配下のファイルは、必ずどれか1つのコンポーネントに属さなければならない。
source_roots = ["src"]

# 検査の対象から外すパス（生成物、サンプルなど）。
ignore = ["examples/**"]

# 品質基盤に足すパス（リンターや型検査の設定、ほかの CI の定義など）。変えるには、承認した人を記録した変更記録が要る。
# trace/gates.toml・trace/config.toml・tools/ の検査ツール・.github/workflows/・.claude/ の hook と skill・AGENTS.md は、
# ここに書かなくても最初から含まれていて、外すことはできない。
# 例: quality_base = ["ruff.toml", "mypy.ini", ".gitlab-ci.yml"]
quality_base = []

# 比較の基準にするブランチ。人が内容を確かめて取り込むブランチの名前を書く。
# 作業はここから分けたブランチで行い、検査は「このブランチとの分かれ目」と比べて、失われたもの・弱まったものを探す
# （python3 tools/tracekit.py regress）。エージェントには、このブランチへ直接コミットさせない。
base_branch = "main"

requirements_dir = "docs/requirements"
changes_dir = "docs/changes"
matrix_file = "docs/traceability.md"

# テストのレベルと、そのレベルに属するファイル。
# キーがそのままレベル名になる（要件の `verify:` に書く名前）。performance など独自のレベルを足してよい。
# 本番コードと同じ場所にテストを置く言語では、たとえば unit = ["src/**/*_test.go"] のように書く。
# フィクスチャなどテストでないファイルが混ざる場合は、glob を絞る（例: "tests/unit/**/test_*.py"）。
[tests]
unit = ["tests/unit/**"]
integration = ["tests/integration/**"]
e2e = ["tests/e2e/**"]
contract = ["tests/contract/**"]

# 粒度の警告。要件が min_requirements 件以上になってから働く。
[granularity]
min_requirements = 5
# 1つのコンポーネントを変えたとき、全要件のうちこの割合を超えて影響するなら「粗すぎる」と警告する。
max_requirement_share = 0.6
# 1つの要件がこの数を超えるコンポーネントにまたがるなら「散らばりすぎ」と警告する。
max_components_per_requirement = 4
